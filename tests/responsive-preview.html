<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Tradingdesk – responsive Sichtprüfung</title>
<style>
body{margin:16px;font:16px system-ui;background:#ddd;color:#111}
label{display:block;margin-bottom:12px}select{font:inherit}
iframe{display:block;width:390px;height:844px;border:1px solid #888;background:white}
</style>
<label>Testbreite
  <select id="size">
    <option value="390">Mobil – 390 px</option>
    <option value="320">Schmal – 320 px</option>
    <option value="768">Tablet – 768 px</option>
    <option value="1440">Desktop – 1440 px</option>
  </select>
</label>
<iframe id="preview" title="Tradingdesk Testansicht" src="../index.html"></iframe>
<script>
document.getElementById('size').addEventListener('change',event=>{
  document.getElementById('preview').style.width=event.target.value+'px';
});
</script>
</html>
