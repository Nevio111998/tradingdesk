name: Refresh public news
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/refresh_news.py', '.github/workflows/news.yml']
permissions:
  contents: write
concurrency:
  group: public-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh_news.py
      - name: Publish headlines only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public RSS headlines'
          git pull --rebase origin main
          git push origin HEAD:main
